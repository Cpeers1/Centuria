plugins {
    id 'java'
	id 'maven-publish'
}

version = "b1.7.4"
group = "org.asf.centuria"

sourceCompatibility = '1.17'
targetCompatibility = '1.17'

def authorname = "AerialWorks Software Foundation"

apply plugin: 'eclipse'
apply plugin: 'idea'

repositories {
    mavenCentral()
    flatDir {
       dirs 'fluid'
   }
}

jar {
	baseName "Centuria"
	manifest {
		attributes([
			"Main-Class": "org.asf.centuria.launcher.LauncherMain",
			"Specification-Title": "Centuria",
			"Specification-Vendor": "${authorname}",
                        "Specification-Version": project.version,
			"Implementation-Title": project.name,
			"Implementation-Version": project.version,
			"Implementation-Vendor" :"${authorname}",
			"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
	includeEmptyDirs = false
}

// task javaDocs(type: Javadoc) {
// 	classpath = sourceSets.main.runtimeClasspath
// 	source = sourceSets.main.allJava
// }

// task javadocJar(type: Jar, dependsOn: 'javaDocs') {
// 	from javadoc
// 	classifier = 'javadoc'
// 	exclude "**/extra/**"
// }

task sourcesJar(type: Jar, dependsOn: classes) {
	baseName "Centuria"
	classifier = 'sources'
	from sourceSets.main.allSource
	exclude "**/extra/**"
}

artifacts {
	// archives javadocJar
	archives sourcesJar
}

dependencies {
	implementation project(":deps:connective-http")
	
	implementation group: 'org.asf.cyan', name: 'Fluid', version: '1.0.0.A33'
	
	implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.25.3'
	implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.25.3'
	
	implementation 'org.ow2.asm:asm:9.9.1'
	implementation 'org.ow2.asm:asm-tree:9.9.1'
	implementation 'org.ow2.asm:asm-commons:9.9.1'

	implementation group: 'com.google.code.gson', name: 'gson', version: '2.13.2'
	implementation group: 'tools.jackson.dataformat', name: 'jackson-dataformat-xml', version: '3.0.3'
	
	implementation group: 'javax.activation', name: 'activation', version: '1.1.1'
	
	implementation group: 'org.apache.commons', name: 'commons-compress', version: '1.28.0'
	implementation group: 'org.tukaani', name: 'xz', version: '1.11'
	implementation group: 'org.joml', name: 'joml', version: '1.10.8'
	
	implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'
	testImplementation group: 'org.slf4j', name: 'slf4j-nop', version: '2.0.17'
	
	implementation group: 'net.objecthunter', name: 'exp4j', version: '0.4.8'
	
	implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.83'
	
	implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.6'
}

project.configurations.implementation.canBeResolved = true

task installation () {
	doLast {
		copy {
			from "centuria"
			from "centuria.bat"
			into "build/Installations"
		}
		for (ResolvedArtifact arti : project.configurations.implementation.resolvedConfiguration.getResolvedArtifacts()) {
			if (arti.getClassifier() != null)
				continue;
			copy {
				from arti.file
				rename arti.file.getName(), arti.name + (arti.getClassifier() != null && !arti.getClassifier().isEmpty() ? "-" + arti.getClassifier() : "") + "." + arti.getExtension()
				into "build/Installations/libs"
			}
		}
		for (def task : project.tasks) {
			if (task instanceof AbstractArchiveTask) {
				if (!task.getArchiveClassifier().get().isEmpty())
					continue;
					
				copy {
					from task.getArchiveFile().get()
					rename task.getArchiveFile().get().getAsFile().getName(), task.getArchiveBaseName().get() + (task.getArchiveClassifier().get() != null && !task.getArchiveClassifier().get().isEmpty() ? "-" + task.getArchiveClassifier().get() : "") + "." + task.getArchiveExtension().get()
					into "build/Installations"
				}
			}
		}
	}
}

installation.dependsOn project.tasks.build
build.finalizedBy installation

task toolscripts () {
	doLast {
		copy {
			from "toollauncher.sh"
			from "toollauncher.bat"
			into "build/tools"
		}
		for (ResolvedArtifact arti : project.configurations.implementation.resolvedConfiguration.getResolvedArtifacts()) {
			if (arti.getClassifier() != null)
				continue;
			copy {
				from arti.file
				rename arti.file.getName(), arti.name + (arti.getClassifier() != null && !arti.getClassifier().isEmpty() ? "-" + arti.getClassifier() : "") + "." + arti.getExtension()
				into "build/tools/libs"
			}
		}
		for (def task : project.tasks) {
			if (task instanceof AbstractArchiveTask) {
				if (!task.getArchiveClassifier().get().isEmpty())
					continue;
					
				copy {
					from task.getArchiveFile().get()
					rename task.getArchiveFile().get().getAsFile().getName(), task.getArchiveBaseName().get() + (task.getArchiveClassifier().get() != null && !task.getArchiveClassifier().get().isEmpty() ? "-" + task.getArchiveClassifier().get() : "") + "." + task.getArchiveExtension().get()
					into "build/tools/libs"
				}
			}
		}
		for (def file : new File("src/main/java/org/asf/centuria/tools").listFiles()) {
			if (!file.isFile())
				continue
			String scriptMain = "org.asf.centuria.tools." + file.getName().replace(".java", "")
			String unixScript = ""
			unixScript += "#!/bin/bash\n"
			unixScript += '''chmod +x "$(dirname "$0")/toollauncher.sh"\n'''
			unixScript += '''chmod +x "$0"\n'''
			unixScript += '''\n'''
			unixScript += '''"$(dirname "$0")/toollauncher.sh" ''' + scriptMain + " " + '''"$@"''' + "\n"
			unixScript += "exit \$?\n"
			String dosScript = ""
			dosScript += "@echo off\n"
			dosScript += "setlocal EnableDelayedExpansion\n"
			dosScript += '''set "dirpath=%~dp0"\n'''
			dosScript += '''"%dirpath%/toollauncher" ''' + scriptMain + ''' %*\n'''
			dosScript += "exit %ERRORLEVEL%\n"
			Files.writeString(new File("build/tools/" + file.getName().replace(".java", "").toLowerCase() + ".bat").toPath(), dosScript)
			Files.writeString(new File("build/tools/" + file.getName().replace(".java", "").toLowerCase()).toPath(), unixScript)
		}
	}
}

toolscripts.dependsOn project.tasks.build
build.finalizedBy toolscripts

import java.nio.file.*
task updateData () {
	doLast {
		copy {
			from "centuria"
			from "centuria.bat"
			into "build/update"
		}
		String data = ""
		for (ResolvedArtifact arti : project.configurations.implementation.resolvedConfiguration.getResolvedArtifacts()) {
			if (arti.getClassifier() != null)
				continue;
			copy {
				from arti.file
				rename arti.file.getName(), arti.name + (arti.getClassifier() != null && !arti.getClassifier().isEmpty() ? "-" + arti.getClassifier() : "") + "." + arti.getExtension()
				into "build/update/libs"
				data += "libs/" + arti.name + (arti.getClassifier() != null && !arti.getClassifier().isEmpty() ? "-" + arti.getClassifier() : "") + "." + arti.getExtension() + "\n"
			}
		}
		for (def task : project.tasks) {
			if (task instanceof AbstractArchiveTask) {
				if (!task.getArchiveClassifier().get().isEmpty())
					continue;
					
				copy {
					from task.getArchiveFile().get()
					rename task.getArchiveFile().get().getAsFile().getName(), task.getArchiveBaseName().get() + (task.getArchiveClassifier().get() != null && !task.getArchiveClassifier().get().isEmpty() ? "-" + task.getArchiveClassifier().get() : "") + "." + task.getArchiveExtension().get()
					into "build/update"
					data += (task.getArchiveBaseName().get() + (task.getArchiveClassifier().get() != null && !task.getArchiveClassifier().get().isEmpty() ? "-" + task.getArchiveClassifier().get() : "") + "." + task.getArchiveExtension().get()).replace(" ", "%20") + "\n"
				}
			}
		}
		Files.writeString(file("build/update/update.list").toPath(), data)
	}
}

updateData.dependsOn project.tasks.build
build.finalizedBy updateData
